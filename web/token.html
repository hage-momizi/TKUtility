<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>TKUC Token Console</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="token-console">
  <div class="container py-4">
    <h1 class="mb-4">TKUC トークンコンソール</h1>

    <div class="row g-4">
      <div class="col-lg-4">
        <div class="card glass-card">
          <div class="card-header">
            <strong>🔐 トークンログイン</strong>
          </div>
          <div class="card-body">
            <div class="mb-3">
              <label class="form-label">プライベートトークン</label>
              <input id="tokenInput" type="password" class="form-control" placeholder="TKU-...">
            </div>
            <div class="d-grid gap-2">
              <button id="loginBtn" class="btn btn-primary">ログイン</button>
              <button id="logoutBtn" class="btn btn-outline-secondary" disabled>ログアウト</button>
            </div>
            <div id="loginStatus" class="mt-3 text-muted"></div>
          </div>
        </div>

        <div class="card glass-card mt-4">
          <div class="card-header d-flex justify-content-between align-items-center">
            <strong>📊 リアルタイム残高</strong>
            <span id="balanceTimestamp" class="badge bg-secondary"></span>
          </div>
          <div class="card-body">
            <div id="balanceInfo" class="balance-display">
              <div class="text-muted">ログインして残高を表示</div>
            </div>
          </div>
        </div>

        <div class="card glass-card mt-4">
          <div class="card-header"><strong>🔔 アラート設定 (ブラウザのみ)</strong></div>
          <div class="card-body">
            <div class="mb-3">
              <label class="form-label">目標レート</label>
              <div class="input-group">
                <input id="alertRate" type="number" class="form-control" placeholder="例: 520">
                <select id="alertDirection" class="form-select" style="max-width:120px">
                  <option value="above">以上で通知</option>
                  <option value="below">以下で通知</option>
                </select>
              </div>
            </div>
            <div class="d-grid gap-2">
              <button id="setAlertBtn" class="btn btn-info">アラート設定</button>
              <button id="clearAlertBtn" class="btn btn-outline-danger">アラート解除</button>
            </div>
            <audio id="alertSound" preload="auto">
              <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_1419b06bbb.mp3" type="audio/mpeg">
            </audio>
          </div>
        </div>
      </div>

      <div class="col-lg-8">
        <div class="card glass-card">
          <div class="card-header d-flex justify-content-between align-items-center">
            <strong>💹 TKUC 取引</strong>
            <div>
              <span class="me-2">現在レート:</span>
              <span id="currentRateDisplay" class="badge bg-primary">--.--</span>
            </div>
          </div>
          <div class="card-body">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">取引種別</label>
                <div class="btn-group w-100" role="group">
                  <input type="radio" class="btn-check" name="tradeType" id="tradeBuy" value="buy" checked>
                  <label class="btn btn-outline-success" for="tradeBuy">購入</label>

                  <input type="radio" class="btn-check" name="tradeType" id="tradeSell" value="sell">
                  <label class="btn btn-outline-danger" for="tradeSell">売却</label>
                </div>
              </div>
              <div class="col-md-6">
                <label class="form-label">数量 (TKUC)</label>
                <input id="tradeAmount" type="number" step="0.01" class="form-control" placeholder="0.00">
              </div>
            </div>

            <div class="mt-3 text-muted" id="tradeSummary">取引内容: --</div>
            <div class="d-grid gap-2 mt-3">
              <button id="executeTradeBtn" class="btn btn-primary" disabled>実行</button>
            </div>
            <div id="tradeResult" class="mt-3"></div>
          </div>
        </div>

        <div class="card glass-card mt-4">
          <div class="card-header"><strong>📜 取引ログ</strong></div>
          <div class="card-body">
            <ul id="tradeLog" class="list-unstyled trade-log mb-0"></ul>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="token.js"></script>
</body>
</html>
