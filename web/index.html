<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TKUtility ニュース管理パネル</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- サーバーサイドバー -->
            <div class="col-md-2 sidebar">
                <h5 class="sidebar-title">サーバー一覧</h5>
                <div id="guild-list" class="guild-list">
                    <!-- サーバーが動的に追加される -->
                </div>
            </div>

            <!-- メインコンテンツ -->
            <div class="col-md-10 main-content">
                <div class="row">
                    <!-- 左側：設定 -->
                    <div class="col-md-6 settings-panel">
                        <h4>ニュース設定</h4>
                        <div id="guild-info">
                            <p>サーバーを選択してください</p>
                        </div>
                        <div id="settings-form" style="display: none;">
                            <div class="mb-3">
                                <label for="channel-select" class="form-label">配信チャンネル</label>
                                <select class="form-select" id="channel-select">
                                    <!-- チャンネルが動的に追加される -->
                                </select>
                            </div>
                            <div id="news-items">
                                <!-- ニュースアイテムが動的に追加される -->
                            </div>
                            <button class="btn btn-primary" onclick="addNewsItem()">ニュースを追加</button>
                            <button class="btn btn-success mt-3" onclick="saveConfig()">保存</button>
                        </div>

                        <!-- AI要約チャット -->
                        <div class="mt-4">
                            <h5>AIニュース要約</h5>
                            <textarea id="ai-input" class="form-control" rows="4" placeholder="ニュースの内容をここに貼り付けてください"></textarea>
                            <button class="btn btn-info mt-2" onclick="summarizeNews()">要約する</button>
                            <div id="ai-output" class="mt-2 p-2 bg-dark text-light rounded" style="min-height: 50px;"></div>
                        </div>
                    </div>

                    <!-- 右側：プレビュー -->
                    <div class="col-md-6 preview-panel">
                        <h4>プレビュー</h4>
                        <div id="preview-container" class="preview-container">
                            <div class="embed-preview">
                                <div class="embed-title">📢 今日のピックアップニュース</div>
                                <div id="embed-fields">
                                    <!-- ニュースフィールドが動的に追加される -->
                                </div>
                                <div class="embed-footer">今</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
