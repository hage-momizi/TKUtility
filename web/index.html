<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TKUC Market Terminal - Real-time Rate Chart</title>
    <!-- CSS Dependencies -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0b0e11;
            --card-bg: #181a20;
            --primary-color: #f0b90b; /* Exchange Gold */
            --text-main: #eaecef;
            --text-muted: #848e9c;
            --up-color: #0ecb81;
            --down-color: #f6465d;
            --border-color: #2b2f36;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
        }

        /* Navbar Customization */
        .navbar {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 0.75rem 1.5rem;
        }

        .navbar-brand {
            font-weight: 700;
            color: var(--primary-color) !important;
            letter-spacing: -0.5px;
        }

        .price-ticker {
            font-family: 'JetBrains+Mono', monospace;
            font-size: 1.1rem;
            font-weight: 600;
        }

        /* Layout Components */
        .main-container {
            padding: 20px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .glass-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            height: 100%;
        }

        .card-header-custom {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Stats Section */
        .market-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .summary-item {
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .summary-label {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 5px;
        }

        .summary-value {
            font-size: 1.25rem;
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
        }

        /* Chart Customization */
        .chart-wrapper {
            padding: 20px;
            height: 500px;
            position: relative;
        }

        /* Order Book Style */
        .order-book-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 15px;
            font-size: 0.9rem;
            font-family: 'JetBrains Mono', monospace;
        }

        .order-book-header {
            color: var(--text-muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            padding: 10px 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .buy-side { color: var(--up-color); }
        .sell-side { color: var(--down-color); }

        /* Timeframe Buttons */
        .btn-group-time {
            background: var(--bg-dark);
            padding: 4px;
            border-radius: 6px;
        }

        .btn-time {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 4px 12px;
            font-size: 0.8rem;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .btn-time.active {
            background: var(--border-color);
            color: var(--primary-color);
        }

        /* Badge Customization */
        .badge-live {
            background: rgba(14, 203, 129, 0.15);
            color: var(--up-color);
            border: 1px solid var(--up-color);
            font-size: 0.7rem;
            padding: 3px 8px;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="fa-solid fa-bolt-lightning me-2"></i>TKUC MARKET TERMINAL
            </a>
            <div class="ms-auto d-flex align-items-center">
                <div class="price-ticker me-3" id="nav-price">
                    <span class="text-muted">TKUC/TKUP</span>
                    <span id="current-rate-nav" class="ms-2">--.--</span>
                </div>
                <span class="badge badge-live"><i class="fa-solid fa-circle fa-beat-fade me-1"></i> 2秒自動更新</span>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <!-- Market Stats Row -->
        <div class="market-summary">
            <div class="summary-item">
                <div class="summary-label">現在の価格</div>
                <div class="summary-value" id="stats-price">0 TKUP</div>
            </div>
            <div class="summary-item">
                <div class="summary-label">変動率</div>
                <div class="summary-value" id="stats-change">+0.00%</div>
            </div>
            <div class="summary-item">
                <div class="summary-label">最高値</div>
                <div class="summary-value" id="stats-high">0 TKUP</div>
            </div>
            <div class="summary-item">
                <div class="summary-label">最安値</div>
                <div class="summary-value" id="stats-low">0 TKUP</div>
            </div>
        </div>

        <div class="row g-4">
            <!-- Main Chart Area (Full Width) -->
            <div class="col-12">
                <div class="glass-card">
                    <div class="card-header-custom">
                        <div class="d-flex align-items-center">
                            <h6 class="mb-0 me-3">価格推移チャート</h6>
                            <div class="btn-group-time">
                                <button class="btn-time active" data-timeframe="10" onclick="updateTimeframe(10, this)">10件</button>
                                <button class="btn-time" data-timeframe="30" onclick="updateTimeframe(30, this)">30件</button>
                                <button class="btn-time" data-timeframe="50" onclick="updateTimeframe(50, this)">50件</button>
                                <button class="btn-time" data-timeframe="100" onclick="updateTimeframe(100, this)">100件</button>
                            </div>
                        </div>
                        <i class="fa-solid fa-chart-line text-muted"></i>
                    </div>
                    <div class="chart-wrapper">
                        <canvas id="mainRateChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- Terminal Info / News -->
        <div class="row mt-4">
            <div class="col-12">
                <div class="glass-card">
                    <div class="card-header-custom">
                        <h6 class="mb-0"><i class="fa-solid fa-bullhorn me-2 text-warning"></i>システム通知 & 市場ニュース</h6>
                    </div>
                    <div class="p-3">
                        <div class="d-flex align-items-start mb-3 border-bottom border-secondary pb-3">
                            <span class="badge bg-primary me-3">重要</span>
                            <div>
                                <div class="fw-bold mb-1">TKUC ネットワークのアップデート完了</div>
                                <div class="text-muted small">システムの安定性が向上し、取引処理速度が20%改善されました。</div>
                            </div>
                        </div>
                        <div class="d-flex align-items-start">
                            <span class="badge bg-secondary me-3">情報</span>
                            <div>
                                <div class="fw-bold mb-1">次回のコミュニティドロップについて</div>
                                <div class="text-muted small">来月の第2週にホルダー向けの報酬配布を予定しています。</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/date-fns@2.29.3/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@2.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>

    <script>
        // --- リアルデータ取得とチャート管理 ---
        let currentRate = 100;
        let chart;
        let rateHistory = [];

        // APIから初期データを取得
        async function fetchInitialData() {
            try {
                const response = await fetch('/api/rate-history?points=50');
                const data = await response.json();
                if (data.success) {
                    currentRate = data.currentRate;
                    rateHistory = data.history.map(h => ({
                        x: h.timestamp,
                        y: h.rate
                    }));
                    return rateHistory;
                }
            } catch (error) {
                console.error('Failed to fetch initial data:', error);
            }
            return [];
        }

        async function initChart() {
            const ctx = document.getElementById('mainRateChart').getContext('2d');

            // グラデーションの作成
            const gradient = ctx.createLinearGradient(0, 0, 0, 400);
            gradient.addColorStop(0, 'rgba(240, 185, 11, 0.2)');
            gradient.addColorStop(1, 'rgba(240, 185, 11, 0)');

            const initialData = await fetchInitialData();

            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: [{
                        label: 'TKUC/TKUP',
                        data: initialData,
                        borderColor: '#f0b90b',
                        borderWidth: 2,
                        pointRadius: 0,
                        fill: true,
                        backgroundColor: gradient,
                        tension: 0.1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        intersect: false,
                        mode: 'index',
                    },
                    scales: {
                        x: {
                            type: 'time',
                            time: { unit: 'minute' },
                            grid: { color: '#2b2f36' },
                            ticks: { color: '#848e9c' }
                        },
                        y: {
                            grid: { color: '#2b2f36' },
                            ticks: { color: '#848e9c' }
                        }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return 'TKUP: ' + context.parsed.y.toFixed(2);
                                }
                            }
                        }
                    }
                }
            });
        }

        // リアルタイムで価格を更新
        async function updateMarketData() {
            try {
                const response = await fetch('/api/current-rate');
                const data = await response.json();

                if (data.success) {
                    const prevRate = currentRate;
                    currentRate = data.rate;

                    // UI更新
                    const priceStr = currentRate.toFixed(2);
                    document.getElementById('current-rate-nav').innerText = priceStr + ' TKUP';
                    document.getElementById('stats-price').innerText = priceStr + ' TKUP';

                    // 24h統計を計算
                    if (chart.data.datasets[0].data.length > 0) {
                        const rates = chart.data.datasets[0].data.map(d => d.y);
                        const high = Math.max(...rates);
                        const low = Math.min(...rates);
                        const first = rates[0];
                        const change = ((currentRate - first) / first * 100).toFixed(2);

                        document.getElementById('stats-high').innerText = high.toFixed(2) + ' TKUP';
                        document.getElementById('stats-low').innerText = low.toFixed(2) + ' TKUP';
                        document.getElementById('stats-change').innerText = (change >= 0 ? '+' : '') + change + '%';
                        document.getElementById('stats-change').className = `summary-value ${change >= 0 ? 'text-success' : 'text-danger'}`;
                    }

                    // チャートデータ追加
                    chart.data.datasets[0].data.push({ x: Date.now(), y: currentRate });
                    if(chart.data.datasets[0].data.length > 100) chart.data.datasets[0].data.shift();
                    chart.update('none');

                    // スプレッド価格の色を変更
                    const priceChange = currentRate - prevRate;
                    document.getElementById('spread-price').className = `fw-bold h5 mb-0 ${priceChange >= 0 ? 'text-success' : 'text-danger'}`;
                }
            } catch (error) {
                console.error('Failed to update market data:', error);
            }
        }

        // 定期的に更新（2秒間隔）
        function startRealtimeUpdates() {
            setInterval(async () => {
                await updateMarketData();
            }, 2000);
        }

        async function updateTimeframe(points, button) {
            document.querySelectorAll('.btn-time').forEach(b => b.classList.remove('active'));
            button.classList.add('active');

            // 指定された件数でデータ再取得
            try {
                const response = await fetch(`/api/rate-history?points=${points}`);
                const data = await response.json();
                if (data.success) {
                    const newData = data.history.map(h => ({
                        x: h.timestamp,
                        y: h.rate
                    }));
                    chart.data.datasets[0].data = newData;
                    chart.update();
                }
            } catch (error) {
                console.error('Failed to update timeframe:', error);
            }
        }

        window.onload = async () => {
            await initChart();
            await updateMarketData();
            startRealtimeUpdates();
        };
    </script>
</body>
</html>
