<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TKUC Exchange Terminal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-primary: #0b0e11;
            --bg-secondary: #161a1e;
            --bg-tertiary: #1e2329;
            --border-color: #2b3139;
            --text-primary: #eaecef;
            --text-secondary: #848e9c;
            --text-tertiary: #5e6673;
            --green: #0ecb81;
            --red: #f6465d;
            --yellow: #fcd535;
            --blue: #3861fb;
            --purple: #b185ff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            overflow-x: hidden;
        }

        /* Header */
        .exchange-header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            color: var(--yellow);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .market-ticker {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .ticker-item {
            display: flex;
            flex-direction: column;
        }

        .ticker-label {
            font-size: 11px;
            color: var(--text-tertiary);
            margin-bottom: 2px;
        }

        .ticker-value {
            font-family: 'Roboto Mono', monospace;
            font-size: 16px;
            font-weight: 600;
        }

        .ticker-value.positive { color: var(--green); }
        .ticker-value.negative { color: var(--red); }

        /* Main Layout */
        .trading-layout {
            display: grid;
            grid-template-columns: 280px 1fr 320px;
            grid-template-rows: auto 1fr;
            height: calc(100vh - 57px);
            gap: 1px;
            background: var(--border-color);
        }

        .panel {
            background: var(--bg-secondary);
            overflow: hidden;
        }

        /* Left Panel - Order Book */
        .orderbook-panel {
            grid-row: 1 / 3;
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .orderbook-content {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }

        .orderbook-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            padding: 3px 16px;
            font-family: 'Roboto Mono', monospace;
            font-size: 12px;
            position: relative;
        }

        .orderbook-row.ask { color: var(--red); }
        .orderbook-row.bid { color: var(--green); }

        .orderbook-row::before {
            content: '';
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            background: currentColor;
            opacity: 0.05;
        }

        /* Center Panel - Chart */
        .chart-panel {
            grid-column: 2;
            grid-row: 1 / 3;
            display: flex;
            flex-direction: column;
        }

        .chart-controls {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-btn {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .control-btn:hover {
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .control-btn.active {
            background: var(--yellow);
            color: var(--bg-primary);
            border-color: var(--yellow);
            font-weight: 600;
        }

        .indicator-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .indicator-btn.active {
            border-color: var(--blue);
            color: var(--blue);
            background: rgba(56, 97, 251, 0.1);
        }

        .chart-container {
            flex: 1;
            position: relative;
            background: var(--bg-primary);
        }

        #mainChart, #rsiChart, #macdChart {
            width: 100%;
            height: 100%;
        }

        /* Right Panel - Trades & Stats */
        .trades-panel {
            grid-column: 3;
            grid-row: 1 / 3;
            display: flex;
            flex-direction: column;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-tertiary);
        }

        .stat-value {
            font-family: 'Roboto Mono', monospace;
            font-size: 14px;
            font-weight: 600;
        }

        .recent-trades {
            flex: 1;
            overflow-y: auto;
        }

        .trade-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            padding: 6px 16px;
            font-family: 'Roboto Mono', monospace;
            font-size: 12px;
            border-bottom: 1px solid rgba(43, 49, 57, 0.3);
        }

        .trade-row:hover {
            background: var(--bg-tertiary);
        }

        .trade-price.buy { color: var(--green); }
        .trade-price.sell { color: var(--red); }

        /* Indicator Panel */
        .indicator-panel {
            height: 150px;
            border-top: 1px solid var(--border-color);
            position: relative;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-tertiary); }

        /* Responsive */
        @media (max-width: 1400px) {
            .trading-layout {
                grid-template-columns: 250px 1fr 280px;
            }
        }

        @media (max-width: 1024px) {
            .trading-layout {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto auto;
            }
            .orderbook-panel, .trades-panel {
                grid-row: auto;
                height: 300px;
            }
        }

        .signal-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            margin-left: 8px;
        }

        .signal-badge.bullish {
            background: rgba(14, 203, 129, 0.2);
            color: var(--green);
        }

        .signal-badge.bearish {
            background: rgba(246, 70, 93, 0.2);
            color: var(--red);
        }

        .signal-badge.neutral {
            background: rgba(132, 142, 156, 0.2);
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="exchange-header">
        <div class="logo">
            <i class="fa-solid fa-chart-line"></i>
            TKUC EXCHANGE
        </div>
        <div class="market-ticker">
            <div class="ticker-item">
                <div class="ticker-label">TKUC/TKUP</div>
                <div class="ticker-value" id="header-price">--.--</div>
            </div>
            <div class="ticker-item">
                <div class="ticker-label">24h変動</div>
                <div class="ticker-value" id="header-change">+0.00%</div>
            </div>
            <div class="ticker-item">
                <div class="ticker-label">24h高値</div>
                <div class="ticker-value" id="header-high">--.--</div>
            </div>
            <div class="ticker-item">
                <div class="ticker-label">24h安値</div>
                <div class="ticker-value" id="header-low">--.--</div>
            </div>
            <div class="ticker-item">
                <div class="ticker-label">24h出来高</div>
                <div class="ticker-value" id="header-volume">--.--</div>
            </div>
        </div>
    </div>

    <!-- Main Trading Layout -->
    <div class="trading-layout">
        <!-- Left: Order Book -->
        <div class="panel orderbook-panel">
            <div class="panel-header">オーダーブック</div>
            <div style="padding: 8px 16px; display: grid; grid-template-columns: 1fr 1fr 1fr; font-size: 11px; color: var(--text-tertiary);">
                <span>価格(TKUP)</span>
                <span style="text-align: right;">数量(TKUC)</span>
                <span style="text-align: right;">合計</span>
            </div>
            <div class="orderbook-content" id="orderbook"></div>
        </div>

        <!-- Center: Chart -->
        <div class="panel chart-panel">
            <div class="chart-controls">
                <div class="control-group">
                    <button class="control-btn" onclick="switchChartType('candlestick', this)">
                        <i class="fa-solid fa-chart-candlestick"></i>
                    </button>
                    <button class="control-btn active" onclick="switchChartType('line', this)">
                        <i class="fa-solid fa-chart-line"></i>
                    </button>
                    <button class="control-btn" onclick="switchChartType('area', this)">
                        <i class="fa-solid fa-chart-area"></i>
                    </button>
                </div>

                <div class="control-group">
                    <button class="control-btn active" onclick="updateTimeframe(50, this)">1分</button>
                    <button class="control-btn" onclick="updateTimeframe(100, this)">5分</button>
                    <button class="control-btn" onclick="updateTimeframe(200, this)">15分</button>
                    <button class="control-btn" onclick="updateTimeframe(500, this)">1時間</button>
                </div>

                <div class="control-group">
                    <span style="font-size: 11px; color: var(--text-tertiary); margin-right: 4px;">インジケーター:</span>
                    <button class="indicator-btn active" onclick="toggleIndicator('rsi', this)">RSI</button>
                    <button class="indicator-btn active" onclick="toggleIndicator('macd', this)">MACD</button>
                    <button class="indicator-btn" onclick="toggleIndicator('bb', this)">BB</button>
                </div>

                <div style="margin-left: auto; display: flex; align-items: center; gap: 8px;">
                    <span style="font-size: 11px; color: var(--text-tertiary);">シグナル:</span>
                    <span class="signal-badge neutral" id="signal-indicator">中立</span>
                </div>
            </div>

            <div class="chart-container">
                <div id="mainChart" style="height: calc(100% - 300px);"></div>
                <div id="rsiChart" class="indicator-panel" style="display: block;"></div>
                <div id="macdChart" class="indicator-panel" style="display: block;"></div>
            </div>
        </div>

        <!-- Right: Stats & Recent Trades -->
        <div class="panel trades-panel">
            <div class="panel-header">市場統計</div>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-label">現在価格</div>
                    <div class="stat-value" id="stat-price">--.--</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">変動率</div>
                    <div class="stat-value" id="stat-change">+0.00%</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">RSI(14)</div>
                    <div class="stat-value" id="stat-rsi" style="color: var(--yellow);">--</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">MACD</div>
                    <div class="stat-value" id="stat-macd" style="color: var(--purple);">--</div>
                </div>
            </div>

            <div class="panel-header" style="border-top: 1px solid var(--border-color);">最近の取引</div>
            <div style="padding: 8px 16px; display: grid; grid-template-columns: 1fr 1fr 1fr; font-size: 11px; color: var(--text-tertiary); border-bottom: 1px solid var(--border-color);">
                <span>価格</span>
                <span style="text-align: right;">数量</span>
                <span style="text-align: right;">時刻</span>
            </div>
            <div class="recent-trades" id="recent-trades"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>

    <script>
        let currentRate = 500;
        let mainChart, rsiChart, macdChart;
        let mainSeries, volumeSeries, rsiSeries, macdLineSeries, macdSignalSeries, macdHistSeries;
        let bbUpperSeries, bbLowerSeries;
        let rateHistory = [];
        let candlestickData = [];
        let volumeData = [];
        let currentChartType = 'line';
        let activeIndicators = { rsi: true, macd: true, bb: false };

        // RSI計算
        function calculateRSI(data, period = 14) {
            const rsi = [];
            for (let i = period; i < data.length; i++) {
                let gains = 0, losses = 0;
                for (let j = i - period; j < i; j++) {
                    const change = data[j + 1].value - data[j].value;
                    if (change > 0) gains += change;
                    else losses += Math.abs(change);
                }
                const avgGain = gains / period;
                const avgLoss = losses / period;
                const rs = avgGain / (avgLoss || 1);
                const rsiValue = 100 - (100 / (1 + rs));
                rsi.push({ time: data[i].time, value: rsiValue });
            }
            return rsi;
        }

        // MACD計算
        function calculateEMA(data, period) {
            const k = 2 / (period + 1);
            const ema = [{ time: data[0].time, value: data[0].value }];
            for (let i = 1; i < data.length; i++) {
                const value = data[i].value * k + ema[i - 1].value * (1 - k);
                ema.push({ time: data[i].time, value });
            }
            return ema;
        }

        function calculateMACD(data) {
            const ema12 = calculateEMA(data, 12);
            const ema26 = calculateEMA(data, 26);
            const macdLine = ema12.map((e, i) => ({ time: e.time, value: e.value - ema26[i].value }));
            const signalLine = calculateEMA(macdLine, 9);
            const histogram = macdLine.map((m, i) => ({
                time: m.time,
                value: i < signalLine.length ? m.value - signalLine[i].value : 0,
                color: m.value >= (signalLine[i]?.value || 0) ? 'rgba(14, 203, 129, 0.5)' : 'rgba(246, 70, 93, 0.5)'
            }));
            return { macdLine, signalLine, histogram };
        }

        // ボリンジャーバンド計算
        function calculateBB(data, period = 20, stdDev = 2) {
            const bb = { upper: [], lower: [], middle: [] };
            for (let i = period - 1; i < data.length; i++) {
                const slice = data.slice(i - period + 1, i + 1);
                const mean = slice.reduce((sum, d) => sum + d.value, 0) / period;
                const variance = slice.reduce((sum, d) => sum + Math.pow(d.value - mean, 2), 0) / period;
                const std = Math.sqrt(variance);
                bb.middle.push({ time: data[i].time, value: mean });
                bb.upper.push({ time: data[i].time, value: mean + stdDev * std });
                bb.lower.push({ time: data[i].time, value: mean - stdDev * std });
            }
            return bb;
        }

        // シグナル判定
        function determineSignal(rsi, macd) {
            let signal = 'neutral';
            if (rsi < 30 && macd > 0) signal = 'bullish';
            else if (rsi > 70 && macd < 0) signal = 'bearish';
            else if (rsi < 40) signal = 'bullish';
            else if (rsi > 60) signal = 'bearish';

            const badge = document.getElementById('signal-indicator');
            badge.className = 'signal-badge ' + signal;
            badge.textContent = signal === 'bullish' ? '買い' : signal === 'bearish' ? '売り' : '中立';
        }

        async function fetchInitialData() {
            try {
                const response = await fetch('/api/rate-history?points=100');
                const data = await response.json();
                if (data.success) {
                    currentRate = data.currentRate;
                    candlestickData = data.history.map(h => {
                        const variance = h.rate * 0.015;
                        return {
                            time: Math.floor(h.timestamp / 1000),
                            open: h.rate - variance * Math.random(),
                            high: h.rate + variance * Math.random(),
                            low: h.rate - variance * Math.random(),
                            close: h.rate
                        };
                    });
                    rateHistory = candlestickData.map(c => ({ time: c.time, value: c.close }));
                    volumeData = data.history.map(h => ({
                        time: Math.floor(h.timestamp / 1000),
                        value: Math.random() * 1000 + 500,
                        color: Math.random() > 0.5 ? 'rgba(14, 203, 129, 0.3)' : 'rgba(246, 70, 93, 0.3)'
                    }));
                    return { candlestickData, rateHistory, volumeData };
                }
            } catch (error) {
                return generateFallbackData();
            }
        }

        function generateFallbackData() {
            const now = Math.floor(Date.now() / 1000);
            const basePrice = 500;
            candlestickData = [];
            rateHistory = [];
            volumeData = [];

            for (let i = 99; i >= 0; i--) {
                const time = now - (i * 60);
                const close = basePrice + (Math.random() - 0.5) * 40;
                const variance = close * 0.015;
                candlestickData.push({
                    time, open: close - variance * Math.random(),
                    high: close + variance * Math.random(),
                    low: close - variance * Math.random(), close
                });
                rateHistory.push({ time, value: close });
                volumeData.push({
                    time, value: Math.random() * 1000 + 500,
                    color: Math.random() > 0.5 ? 'rgba(14, 203, 129, 0.3)' : 'rgba(246, 70, 93, 0.3)'
                });
            }
            currentRate = candlestickData[candlestickData.length - 1].close;
            return { candlestickData, rateHistory, volumeData };
        }

        async function initCharts() {
            const data = await fetchInitialData();

            // Main Chart
            const mainContainer = document.getElementById('mainChart');
            mainChart = LightweightCharts.createChart(mainContainer, {
                layout: { background: { color: '#0b0e11' }, textColor: '#848e9c' },
                grid: { vertLines: { color: '#2b3139' }, horzLines: { color: '#2b3139' } },
                crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
                rightPriceScale: { borderColor: '#2b3139' },
                timeScale: { borderColor: '#2b3139', timeVisible: true, secondsVisible: false },
                width: mainContainer.clientWidth,
                height: mainContainer.clientHeight
            });

            mainSeries = mainChart.addLineSeries({
                color: '#fcd535', lineWidth: 2,
                priceFormat: { type: 'price', precision: 2, minMove: 0.01 }
            });
            mainSeries.setData(rateHistory);

            volumeSeries = mainChart.addHistogramSeries({
                priceFormat: { type: 'volume' }, priceScaleId: ''
            });
            volumeSeries.priceScale().applyOptions({ scaleMargins: { top: 0.8, bottom: 0 } });
            volumeSeries.setData(volumeData);

            // RSI Chart
            const rsiContainer = document.getElementById('rsiChart');
            rsiChart = LightweightCharts.createChart(rsiContainer, {
                layout: { background: { color: '#0b0e11' }, textColor: '#848e9c' },
                grid: { vertLines: { color: '#2b3139' }, horzLines: { color: '#2b3139' } },
                rightPriceScale: { borderColor: '#2b3139' },
                timeScale: { borderColor: '#2b3139', visible: false },
                width: rsiContainer.clientWidth,
                height: 150
            });

            rsiSeries = rsiChart.addLineSeries({ color: '#b185ff', lineWidth: 2 });
            const rsiData = calculateRSI(rateHistory);
            rsiSeries.setData(rsiData);

            // MACD Chart
            const macdContainer = document.getElementById('macdChart');
            macdChart = LightweightCharts.createChart(macdContainer, {
                layout: { background: { color: '#0b0e11' }, textColor: '#848e9c' },
                grid: { vertLines: { color: '#2b3139' }, horzLines: { color: '#2b3139' } },
                rightPriceScale: { borderColor: '#2b3139' },
                timeScale: { borderColor: '#2b3139', visible: false },
                width: macdContainer.clientWidth,
                height: 150
            });

            const macd = calculateMACD(rateHistory);
            macdLineSeries = macdChart.addLineSeries({ color: '#3861fb', lineWidth: 2 });
            macdLineSeries.setData(macd.macdLine);

            macdSignalSeries = macdChart.addLineSeries({ color: '#f6465d', lineWidth: 1 });
            macdSignalSeries.setData(macd.signalLine);

            macdHistSeries = macdChart.addHistogramSeries({ priceFormat: { type: 'price', precision: 2 } });
            macdHistSeries.setData(macd.histogram);

            // 初期シグナル判定
            if (rsiData.length > 0) {
                determineSignal(rsiData[rsiData.length - 1].value, macd.macdLine[macd.macdLine.length - 1].value);
            }

            updateUI();
            generateOrderBook();
            generateRecentTrades();
        }

        function switchChartType(type, button) {
            document.querySelectorAll('.chart-controls .control-btn').forEach(b => {
                if (b.querySelector('i')) b.classList.remove('active');
            });
            button.classList.add('active');
            if (currentChartType === type) return;
            currentChartType = type;
            mainChart.removeSeries(mainSeries);

            if (type === 'candlestick') {
                mainSeries = mainChart.addCandlestickSeries({
                    upColor: '#0ecb81', downColor: '#f6465d',
                    borderVisible: false, wickUpColor: '#0ecb81', wickDownColor: '#f6465d'
                });
                mainSeries.setData(candlestickData);
            } else if (type === 'line') {
                mainSeries = mainChart.addLineSeries({ color: '#fcd535', lineWidth: 2 });
                mainSeries.setData(rateHistory);
            } else if (type === 'area') {
                mainSeries = mainChart.addAreaSeries({
                    topColor: 'rgba(252, 213, 53, 0.4)',
                    bottomColor: 'rgba(252, 213, 53, 0.0)',
                    lineColor: '#fcd535', lineWidth: 2
                });
                mainSeries.setData(rateHistory);
            }
        }

        function toggleIndicator(indicator, button) {
            button.classList.toggle('active');
            activeIndicators[indicator] = !activeIndicators[indicator];

            if (indicator === 'rsi') {
                document.getElementById('rsiChart').style.display = activeIndicators.rsi ? 'block' : 'none';
            } else if (indicator === 'macd') {
                document.getElementById('macdChart').style.display = activeIndicators.macd ? 'block' : 'none';
            } else if (indicator === 'bb') {
                if (activeIndicators.bb) {
                    const bb = calculateBB(rateHistory);
                    bbUpperSeries = mainChart.addLineSeries({ color: '#848e9c', lineWidth: 1, lineStyle: 2 });
                    bbLowerSeries = mainChart.addLineSeries({ color: '#848e9c', lineWidth: 1, lineStyle: 2 });
                    bbUpperSeries.setData(bb.upper);
                    bbLowerSeries.setData(bb.lower);
                } else {
                    if (bbUpperSeries) mainChart.removeSeries(bbUpperSeries);
                    if (bbLowerSeries) mainChart.removeSeries(bbLowerSeries);
                }
            }
        }

        function updateTimeframe(points, button) {
            document.querySelectorAll('.chart-controls .control-btn').forEach(b => {
                if (!b.querySelector('i')) b.classList.remove('active');
            });
            button.classList.add('active');
        }

        function updateUI() {
            const price = currentRate.toFixed(2);
            const change = ((Math.random() - 0.5) * 5).toFixed(2);
            const changeClass = change >= 0 ? 'positive' : 'negative';

            document.getElementById('header-price').textContent = price + ' TKUP';
            document.getElementById('header-change').textContent = (change >= 0 ? '+' : '') + change + '%';
            document.getElementById('header-change').className = 'ticker-value ' + changeClass;
            document.getElementById('header-high').textContent = (currentRate * 1.05).toFixed(2);
            document.getElementById('header-low').textContent = (currentRate * 0.95).toFixed(2);
            document.getElementById('header-volume').textContent = '1.2M TKUC';

            document.getElementById('stat-price').textContent = price + ' TKUP';
            document.getElementById('stat-change').textContent = (change >= 0 ? '+' : '') + change + '%';
            document.getElementById('stat-change').style.color = change >= 0 ? 'var(--green)' : 'var(--red)';

            const rsiData = calculateRSI(rateHistory);
            if (rsiData.length > 0) {
                const rsi = rsiData[rsiData.length - 1].value.toFixed(1);
                document.getElementById('stat-rsi').textContent = rsi;
            }

            const macd = calculateMACD(rateHistory);
            if (macd.macdLine.length > 0) {
                document.getElementById('stat-macd').textContent = macd.macdLine[macd.macdLine.length - 1].value.toFixed(2);
            }
        }

        function generateOrderBook() {
            const container = document.getElementById('orderbook');
            let html = '';
            for (let i = 0; i < 20; i++) {
                const price = (currentRate + (10 - i) * 0.5).toFixed(2);
                const amount = (Math.random() * 100 + 50).toFixed(2);
                const total = (price * amount).toFixed(2);
                const type = i < 10 ? 'ask' : 'bid';
                const width = Math.random() * 60 + 20;
                html += `<div class="orderbook-row ${type}" style="--width: ${width}%">
                    <span>${price}</span>
                    <span style="text-align: right;">${amount}</span>
                    <span style="text-align: right;">${total}</span>
                </div>`;
            }
            container.innerHTML = html;
        }

        function generateRecentTrades() {
            const container = document.getElementById('recent-trades');
            let html = '';
            for (let i = 0; i < 30; i++) {
                const isBuy = Math.random() > 0.5;
                const price = (currentRate + (Math.random() - 0.5) * 2).toFixed(2);
                const amount = (Math.random() * 10 + 1).toFixed(2);
                const time = new Date(Date.now() - i * 5000).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                html += `<div class="trade-row">
                    <span class="trade-price ${isBuy ? 'buy' : 'sell'}">${price}</span>
                    <span style="text-align: right;">${amount}</span>
                    <span style="text-align: right; color: var(--text-tertiary);">${time}</span>
                </div>`;
            }
            container.innerHTML = html;
        }

        async function updateMarketData() {
            try {
                const response = await fetch('/api/current-rate');
                const data = await response.json();
                if (data.success) {
                    currentRate = data.rate;
                    const now = Math.floor(Date.now() / 1000);

                    rateHistory.push({ time: now, value: currentRate });
                    if (rateHistory.length > 200) rateHistory.shift();

                    if (currentChartType === 'line' || currentChartType === 'area') {
                        mainSeries.update({ time: now, value: currentRate });
                    }

                    const rsiData = calculateRSI(rateHistory);
                    if (rsiData.length > 0) {
                        rsiSeries.update(rsiData[rsiData.length - 1]);
                    }

                    const macd = calculateMACD(rateHistory);
                    if (macd.macdLine.length > 0) {
                        macdLineSeries.update(macd.macdLine[macd.macdLine.length - 1]);
                        macdSignalSeries.update(macd.signalLine[macd.signalLine.length - 1]);
                        macdHistSeries.update(macd.histogram[macd.histogram.length - 1]);
                        determineSignal(rsiData[rsiData.length - 1].value, macd.macdLine[macd.macdLine.length - 1].value);
                    }

                    updateUI();
                }
            } catch (error) {
                console.error('Update failed:', error);
            }
        }

        window.addEventListener('resize', () => {
            if (mainChart) mainChart.resize(document.getElementById('mainChart').clientWidth, document.getElementById('mainChart').clientHeight);
            if (rsiChart) rsiChart.resize(document.getElementById('rsiChart').clientWidth, 150);
            if (macdChart) macdChart.resize(document.getElementById('macdChart').clientWidth, 150);
        });

        window.onload = async () => {
            await initCharts();
            setInterval(updateMarketData, 2000);
            setInterval(generateOrderBook, 3000);
            setInterval(generateRecentTrades, 5000);
        };
    </script>
</body>
</html>
